[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "python_local_ai"
version = "0.1.0"
description = "OS-native, on-device AI for Python, powered by rust_local_ai."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Francesco Vezzani" }]
keywords = ["ai", "local-ai", "on-device", "apple-intelligence", "foundation-models"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://vezz.io"
Repository = "https://github.com/kekko7072/python_local_ai"
"Universal Local AI" = "https://github.com/kekko7072/universal_local_ai"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "python_local_ai._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = "--doctest-modules"
