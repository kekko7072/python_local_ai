[package]
name = "python_local_ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Python bindings for rust_local_ai: OS-native, on-device AI"
authors = ["Francesco Vezzani"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kekko7072/python_local_ai"
homepage = "https://vezz.io"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
# The testing feature ships rust_local_ai's deterministic FakeBackend as
# python_local_ai.testing, so downstream projects can test without OS AI.
rust_local_ai = { version = "0.2.0", features = ["testing"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
